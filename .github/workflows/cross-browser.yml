name: Cross-browser baseline

# 可选检查：手动触发，或在 PR 上添加 `cross-browser` 标签时运行。
# 不改变 CI 里 Chromium 的验收基线。
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  cross-browser:
    name: Cross-browser baseline (optional)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'cross-browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:cross-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-test-results
          path: test-results/
          retention-days: 7
